name: Internship check

on:
  schedule:
    # every 15 min on off-peak minutes (GitHub drops many scheduled runs: hourly gave ~5 runs/day)
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run tracker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 tracker.py

      - name: Commit updated state and status page
        run: |
          git config user.name "internship-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json STATUS.md docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "check: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
